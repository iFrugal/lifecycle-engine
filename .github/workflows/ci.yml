name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so pushes while CI is running
# don't pile up in the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['25']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Validate Maven reactor
        run: ./mvnw -B -ntp validate

      - name: Build & verify
        # -Dgpg.skip=true: maven-gpg-plugin is inherited from ifrugal-parent
        # and binds to verify. CI has no GPG key configured; signing is a
        # release-time concern, not a CI concern.
        run: ./mvnw -B -ntp -U -Dgpg.skip=true clean verify

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  sonarcloud:
    name: SonarCloud quality analysis
    runs-on: ubuntu-latest
    needs: build
    # Don't block PR completion on SonarCloud — it's a quality gate, not a release gate.
    # Also skip for forks which don't have access to SONAR_TOKEN.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -ntp -Dgpg.skip=true verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=iFrugal_lifecycle-engine

  dependency-analyze:
    name: Dependency hygiene
    runs-on: ubuntu-latest
    needs: build
    # Don't block PR completion on this — it's a hygiene check, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Analyze declared vs. used dependencies
        # Pin to 3.9.0: earlier versions bundle an ASM that can't read
        # Java 25 bytecode (major version 69), failing with
        # "Byte code of ... is corrupt ... Unsupported class file major
        # version 69". 3.9.0 was the first release with ASM new enough
        # for JDK 25 support.
        run: ./mvnw -B -ntp -DskipTests -Dgpg.skip=true
          org.apache.maven.plugins:maven-dependency-plugin:3.9.0:analyze
